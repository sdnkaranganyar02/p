<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Perpustakaan - SDN Karanganyar 02</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..700,0..1,0&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    
    <style>
      /* CSS KHUSUS HALAMAN PERPUSTAKAAN */
      .library-section {
        padding: 120px 24px 60px; /* Padding atas biar nggak ketutup navbar */
        max-width: 1100px;
        margin: 0 auto;
      }
      .book-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 30px;
        margin-top: 40px;
      }
      .book-card {
        background: #fff;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        transition: transform 0.3s, box-shadow 0.3s;
        text-decoration: none;
        color: inherit;
        display: flex;
        flex-direction: column;
      }
      .book-card:hover {
        transform: translateY(-8px);
        box-shadow: 0 12px 25px rgba(15, 77, 60, 0.15);
      }
      .book-cover {
        width: 100%;
        aspect-ratio: 3 / 4;
        object-fit: cover;
        background: #e0e0e0;
      }
      .book-info {
        padding: 20px;
        text-align: center;
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .book-info h3 {
        margin: 0 0 10px;
        font-size: 1.1rem;
        color: #0f4d3c;
      }
      .book-info p {
        margin: 0;
        font-size: 0.85rem;
        color: #666;
      }
    </style>
  </head>
  <body>
    <!-- NAVBAR (Sama seperti index) -->
    <header class="site-header" data-header>
      <a class="brand" href="index.html">
        <img src="assets/1.jpeg" alt="Logo" class="brand-mark">
        <span><strong>SDN Karanganyar 02</strong><small>Yosowilangun</small></span>
      </a>
      <nav class="main-nav" style="display: flex; align-items: center; gap: 15px;">
        <a href="index.html">Beranda</a>
        <a href="index.html#profil">Profil</a>
        <a href="index.html#program">Program</a>
        <a href="perpustakaan.html" style="font-weight: bold; color: #0f4d3c;">Perpustakaan</a>
        <a href="index.html#kontak">Kontak</a>
      </nav>
    </header>

    <!-- KONTEN PERPUSTAKAAN -->
    <main class="library-section">
      <div style="text-align: center; margin-bottom: 30px;">
        <h1 style="color: #0f4d3c; font-size: 2.5rem; margin-bottom: 10px;">Perpustakaan Digital</h1>
        <p style="color: #666; font-size: 1.1rem;">Pilih buku bacaan favoritmu di bawah ini.</p>
      </div>

      <div class="book-grid">
        
        <!-- KARTU BUKU 1 -->
        <a href="buku-1.html" class="book-card">
          <!-- GANTI src DENGAN GAMBAR COVER BUKU KAMU -->
          <img src="assets/buku-1.jpg" alt="Cover Buku 1" class="book-cover" onerror="this.src='https://via.placeholder.com/300x400?text=Cover+Buku+1'">
          <div class="book-info">
            <h3>Petualangan Si Kancil</h3>
            <p>Dongeng Fabel</p>
          </div>
        </a>

        <!-- KARTU BUKU 2 (Contoh duplikat, tinggal ganti link & gambar) -->
        <a href="buku-2.html" class="book-card">
          <img src="assets/buku-2.jpg" alt="Cover Buku 2" class="book-cover" onerror="this.src='https://via.placeholder.com/300x400?text=Cover+Buku+2'">
          <div class="book-info">
            <h3>Belajar Membaca Cepat</h3>
            <p>Buku Pelajaran</p>
          </div>
        </a>

      </div>
    </main>

    <footer class="site-footer" style="margin-top: 60px;">
      <div><strong>SDN Karanganyar 02</strong><span>Yosowilangun</span></div>
      <p>&copy; 2026 SDN Karanganyar 02.</p>
    </footer>
  </body>
</html>
